baseURL: https://yuan-xinyi.github.io/blogs/
languageCode: zh-cn
defaultContentLanguage: zh
title: Xinyi's Blog
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

minify:
  disableXML: true

outputs:
  home:
    - HTML
    - RSS
    - JSON # required by PaperMod's search page

menu:
  main:
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 10
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: search
      name: 搜索
      url: /search/
      weight: 30

params:
  env: production
  description: "强化学习、机器学习以及其他正在学的东西的笔记。"
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowToc: true

  homeInfoParams:
    Title: "👋"
    Content: ""

  socialIcons:
    - name: github
      url: "https://github.com/Yuan-Xinyi"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
